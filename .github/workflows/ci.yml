name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Validate Source Code & Bundle Syntax
      run: |
        node -c src/edge-offline.js
        node -c src/edge-mobile.js
        node -c src/edge-turn-accelerator.js
        node -c src/edge-mobile-pack.js
        echo "All JS modules passed syntax validation!"

    - name: Verify Minified Bundles
      run: |
        test -f dist/edge-offline.min.js
        test -f dist/edge-mobile.min.js
        test -f dist/edge-turn-accelerator.min.js
        test -f dist/edge-mobile-pack.min.js
        test -f dist/edge-mobile-pack.min.css
        echo "All production distribution files are present!"
